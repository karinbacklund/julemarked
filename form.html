<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formular | Julemarked</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./index.html" page">
        <img src="./imgs/logo2.png"></a>
      <nav class="site-nav">
        <button popovertarget="menu">Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./index.html">Julemarked 2026</a></li>
          <li><a href="./svg.html">Kort over området</a></li>
          <li><a href="./form.html" aria-current="page">Nyhedsbrev</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="form-page">
      <div class="left-side">
        <header class="form-intro">
          <h1>Få julestemning direkte i din indbakke</h1>
          <p>Du vil modtage vores nyhedsbrev med spændende information om julemarkedet, herunder nyheder, aktiviteter og
            kommende
            begivenheder.</p>
        </header>

        <form class="form-placeholder" action="./opsamling.html">
          <div class="form-group">
            <label for="mail"> Indtast din e-mailadresse:</label>
            <input type="text" id="mail" value="your@example.dk" required />
          </div>
          <div class="form-group">
            <label for="fornavn">Fornavn:</label>
            <input type="text" id="fornavn" required />
          </div>
          <div class="form-group">
            <label for="efternavn">Efternavn</label>
            <input type="text" id="efternavn" required />
          </div>
          <div class="form-group">



            <label for="nyhedsbrev"> <input type="checkbox" id="nyhedsbrev" required /> Jeg ønsker at modtage nyhedsbrev
              og <br>
              informationer om julemarkedet.</label>

          </div>
          <div class="form-group">
            <label for="variation">Vælg din julestemning (variation):</label>
            <select id="variation">
              <option value="spisested">Variation 1: 20% rabat på spisested</option>
              <option value="aktiviteter">Variation 2: 20% i Gaveværkstedet</option>
            </select>
          </div>
          <button class="tilmeld">Tilmeld mig nyhedsbrevet</button>
        </form>
      </div>
      <div class="right-side">
        <img src="./imgs/julelanterne.png" alt="Billede af en julelandterne">
      </div>
    </section>


  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-kontakt">
        <h4>KONTAKT</h4>
        <p>GAVNØ 2, 4700 NÆSTVED</p>
        <p>+4524871063</p>
      </div>

      <div class="footer-socials">
        <a href="#" aria-label="Instagram">
          <img src="./imgs/insta.png" alt="Instagram">
        </a>
        <a href="#" aria-label="YouTube">
          <img src="./imgs/youtube.png" alt="YouTube">
        </a>
        <a href="#" aria-label="Snapchat">
          <img src="./imgs/snap.png" alt="Snapchat">
        </a>
      </div>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
